name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners already include the Android SDK and sdkmanager.
      # android-actions/setup-android@v3 currently attempts to install the obsolete
      # "tools" package, which is no longer available and breaks the build.
      - name: Install required Android SDK components
        shell: bash
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chanvault-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
