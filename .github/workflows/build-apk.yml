name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test media download URL validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/media-validator"
          javac -d "$RUNNER_TEMP/media-validator" \
            app/src/main/java/dev/chanvault/reader/MediaAddress.java \
            tools/MediaAddressValidationTest.java
          java -cp "$RUNNER_TEMP/media-validator" dev.chanvault.reader.MediaAddressValidationTest
      - name: Install required Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK command-line tools not found in $SDK_ROOT"
            exit 1
          fi
          echo "Using Android SDK manager: $SDKMANAGER"
          (yes | "$SDKMANAGER" --licenses) >/dev/null 2>&1 || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chanvault-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
