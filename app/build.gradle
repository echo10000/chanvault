plugins { id 'com.android.application' }
android {
    namespace 'dev.chanvault.reader'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.chanvault.reader'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '0.5.0'
        manifestPlaceholders = [appDisplayName: 'ChanVault']
    }
    // Signed releases use a keystore held in GitHub Actions Secrets,
    // NEVER checked into this public repository.
    signingConfigs {
        release {
            def signingFile = System.getenv('CHANVAULT_KEYSTORE_PATH')
            def signingPassword = System.getenv('CHANVAULT_SIGNING_PASSWORD')
            if (signingFile && signingPassword) {
                storeFile file(signingFile)
                storePassword signingPassword
                keyAlias 'chanvault'
                keyPassword signingPassword
            }
        }
    }
    buildTypes {
        // Every public CI debug build is signed with a temporary runner key.
        // A separate application ID lets new testers install without ever
        // uninstalling the original package and its app-private vault.
        debug {
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            manifestPlaceholders = [appDisplayName: 'ChanVault Preview']
        }
        release {
            minifyEnabled false
            if (System.getenv('CHANVAULT_KEYSTORE_PATH') && System.getenv('CHANVAULT_SIGNING_PASSWORD')) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
